<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode</title>
<link rel="icon" href="/icon.svg?v=4" type="image/svg+xml">
<link rel="icon" href="/icon-light-32x32.png?v=4" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-icon.png?v=4">
<link rel="stylesheet" href="base.css">
<style>
  #code { position: fixed; }
  .sl { position: absolute; left: 0; top: 0; overflow: hidden; cursor: pointer; border-radius: 1px; will-change: transform, width, height; }
  .sl img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: none; }
</style>
</head>
<body>
<a class="back" href="index.html" aria-label="back to all four"><i>←</i></a>
<div id="code"></div>
<div class="credit"><span>designed by <a href="https://dannymiguel.com" target="_blank" rel="noopener">dannymiguel.com</a></span><span>more work on <a href="https://aestudio.site" target="_blank" rel="noopener">aestudio.site</a></span><span class="note"><span class="l">All images pulled straight from Pinterest, so sadly I can&rsquo;t credit the artists.</span><span class="s">Images via Pinterest, can&rsquo;t credit the artists.</span></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="data.js"></script>
<script>
// colour-sorted: saturated pieces run through the spectrum, the quiet ones close it out
const vivid = WORK.filter(w => w.sat >= 0.3).sort((a, b) => ((a.hue + 20) % 360) - ((b.hue + 20) % 360));
const quiet = WORK.filter(w => w.sat < 0.3).sort((a, b) => a.hue - b.hue);
const list = [...vivid, ...quiet];
const N = list.length;
const code = document.getElementById('code');

const slices = list.map((w, i) => {
  const el = document.createElement('div'); el.className = 'sl';
  el.style.background = w.color;
  const img = new Image(); img.src = w.src; img.alt = ''; img.draggable = false;
  el.appendChild(img); code.appendChild(el);
  return { el, img, ar: w.w / w.h };
});

let open = -1, G, vert, cw, ch, gap;
function measure() {
  const W = innerWidth, H = innerHeight;
  vert = W < H * 0.85;
  gap = vert ? 2 : 3;
  if (vert) { cw = W - 32; ch = H - 168; }
  else { cw = W - (W < 1000 ? 48 : 80); ch = Math.min(H * 0.74, H - 140); }
  code.style.left = (W - cw) / 2 + 'px';
  code.style.top = (H - ch) / 2 + (vert ? 4 : -8) + 'px';
  code.style.width = cw + 'px'; code.style.height = ch + 'px';
  // size each image to its fully-open size so opening reveals it instead of rescaling it
  slices.forEach(s => {
    const full = openSize(s);
    if (vert) { s.img.style.width = cw + 'px'; s.img.style.height = Math.max(full, cw / s.ar) + 'px'; }
    else { s.img.style.height = ch + 'px'; s.img.style.width = Math.max(full, ch * s.ar) + 'px'; }
  });
}
function openSize(s) { return vert ? Math.min(cw / s.ar, ch * 0.6) : Math.min(ch * s.ar, cw * 0.46); }

function layout(animate) {
  const span = vert ? ch : cw;
  const big = open >= 0 ? openSize(slices[open]) : 0;
  const rest = (span - big - gap * (N - 1)) / (open >= 0 ? N - 1 : N);
  let p = 0;
  slices.forEach((s, i) => {
    const size = i === open ? big : rest;
    const props = vert ? { x: 0, y: p, width: cw, height: size } : { x: p, y: 0, width: size, height: ch };
    if (animate) gsap.to(s.el, { ...props, duration: 0.75, ease: 'expo.out', overwrite: 'auto' });
    else gsap.set(s.el, props);
    p += size + gap;
  });
}

function setOpen(i) { if (i === open) return; open = i; layout(true); }

const coarse = matchMedia('(pointer: coarse)').matches;
slices.forEach((s, i) => {
  if (coarse) s.el.addEventListener('click', () => setOpen(open === i ? -1 : i));
  else s.el.addEventListener('pointerenter', () => setOpen(i));
});
if (!coarse) code.addEventListener('pointerleave', () => setOpen(-1));

measure(); layout(false);
gsap.from(slices.map(s => s.el), {
  [vert ? 'scaleX' : 'scaleY']: 0, transformOrigin: vert ? '0% 50%' : '50% 100%',
  duration: 1, ease: 'expo.out', stagger: 0.03, delay: 0.15
});

let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { measure(); layout(false); }, 60); });
</script>
</body>
</html>
