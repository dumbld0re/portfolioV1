<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<link rel="icon" href="/icon.svg?v=4" type="image/svg+xml">
<link rel="icon" href="/icon-light-32x32.png?v=4" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-icon.png?v=4">
<link rel="stylesheet" href="base.css">
<style>
  #field { position: fixed; inset: 0; }
  .slot { position: absolute; left: 0; top: 0; cursor: pointer; will-change: transform; }
  .par, .flo { width: 100%; height: 100%; }
  .slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 2px; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .slot:not(.is-feat):hover img { transform: scale(1.12); }
  .slot.is-feat { cursor: default; }
  .slot.is-feat img { box-shadow: 0 1px 2px rgba(20,18,18,.06), 0 18px 50px -18px rgba(20,18,18,.28); }
  body.globe #field { cursor: grab; touch-action: none; }
  body.globe #field:active { cursor: grabbing; }

  .mode {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 6000;
    display: grid; grid-template-columns: 1fr 1fr; padding: 3px;
    border: 1px solid #EDE5E5; border-radius: 999px; background: var(--snow);
  }
  .mode button {
    font: 500 11px/1 'Geist Mono', ui-monospace, monospace; letter-spacing: .02em;
    color: var(--mute); background: none; border: 0; border-radius: 999px;
    padding: 7px 14px; cursor: pointer; transition: color .25s, background .25s;
  }
  .mode button:hover { color: var(--ink); }
  .mode button.on { background: var(--ink); color: var(--snow); }
</style>
</head>
<body>
<a class="back" href="index.html" aria-label="back to all four"><i>←</i></a>
<div class="mode"><button data-m="orbit" class="on">Orbit</button><button data-m="globe">Globe</button></div>
<div id="field"></div>
<div class="credit"><span>designed by <a href="https://dannymiguel.com" target="_blank" rel="noopener">dannymiguel.com</a></span><span class="note"><span class="l">All images pulled straight from Pinterest, so sadly I can&rsquo;t credit the artists.</span><span class="s">Images via Pinterest, can&rsquo;t credit the artists.</span></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="data.js"></script>
<script>
const WORK = window.WORK;
const N = WORK.length;
const field = document.getElementById('field');

const items = WORK.map((w, i) => {
  const slot = document.createElement('div'); slot.className = 'slot';
  const par = document.createElement('div'); par.className = 'par';
  const flo = document.createElement('div'); flo.className = 'flo';
  const img = new Image(); img.src = w.src; img.alt = ''; img.draggable = false;
  flo.appendChild(img); par.appendChild(flo); slot.appendChild(par); field.appendChild(slot);
  slot.addEventListener('click', () => {
    if (mode === 'globe') { if (!G.moved) focusGlobe(i); return; }
    if (i !== feat) setFeatured(i);
  });
  return { slot, par, flo, ar: w.w / w.h, depth: 0 };
});

let feat = 0;

// one layout: featured in the middle, the rest on a sunflower spiral, then relaxed so nothing overlaps
function layout(f) {
  const W = innerWidth, H = innerHeight;
  const portrait = W < H;
  const cx = W / 2, cy = H / 2 - (portrait ? 10 : 6);
  const fh = Math.min(H * (portrait ? 0.36 : 0.46), (W * (portrait ? 0.56 : 0.4)) / items[f].ar);
  const fw = fh * items[f].ar;
  const U = Math.min(H, W * (portrait ? 1.6 : 0.9));
  const rx = W * (portrait ? 0.47 : 0.38), ry = H * (portrait ? 0.43 : 0.46);
  const s0 = Math.sqrt((fw / 2 / rx) ** 2 + (fh / 2 / ry) ** 2) + 0.06;
  const out = new Array(N);
  out[f] = { x: cx - fw / 2, y: cy - fh / 2, w: fw, h: fh, t: -1 };
  const pad = portrait ? 6 : 10;
  const ring = [];
  for (let k = 0; k < N - 1; k++) {
    const i = (f + 1 + k) % N;
    const t = k / (N - 2);
    const hh = U * (portrait ? 0.125 - 0.06 * t : 0.175 - 0.085 * t);
    const ww = hh * items[i].ar;
    const a = k * 2.39996 + 0.6;
    const r = s0 + (1 - s0) * Math.sqrt((k + 0.5) / (N - 1));
    ring.push({ i, t, w: ww, h: hh, x: cx + Math.cos(a) * rx * r - ww / 2, y: cy + Math.sin(a) * ry * r - hh / 2 });
  }
  const minX = 14, maxX = W - 14, minY = 80, maxY = H - (portrait ? 70 : 56);
  const F = out[f];
  for (let it = 0; it < 120; it++) {
    for (let a = 0; a < ring.length; a++) {
      const A = ring[a];
      for (let b = a + 1; b < ring.length; b++) {
        const B = ring[b];
        const ox = Math.min(A.x + A.w, B.x + B.w) + pad - Math.max(A.x, B.x);
        const oy = Math.min(A.y + A.h, B.y + B.h) + pad - Math.max(A.y, B.y);
        if (ox > 0 && oy > 0) {
          if (ox < oy) { const d = ox / 2 * (A.x < B.x ? -1 : 1); A.x += d; B.x -= d; }
          else { const d = oy / 2 * (A.y < B.y ? -1 : 1); A.y += d; B.y -= d; }
        }
      }
      // keep clear of the featured piece
      const p2 = pad * 2.4;
      const ox = Math.min(A.x + A.w, F.x + F.w) + p2 - Math.max(A.x, F.x);
      const oy = Math.min(A.y + A.h, F.y + F.h) + p2 - Math.max(A.y, F.y);
      if (ox > 0 && oy > 0) {
        if (ox < oy) A.x += A.x + A.w / 2 < cx ? -ox : ox;
        else A.y += A.y + A.h / 2 < cy ? -oy : oy;
      }
      A.x = Math.max(minX, Math.min(maxX - A.w, A.x));
      A.y = Math.max(minY, Math.min(maxY - A.h, A.y));
    }
  }
  ring.forEach(r => out[r.i] = r);
  return out;
}

function apply(L, animate, onDone) {
  items.forEach((it, i) => {
    const p = L[i];
    it.depth = p.t < 0 ? 0.16 : 0.4 + p.t * 1.1;
    it.slot.classList.toggle('is-feat', i === feat);
    it.slot.style.zIndex = i === feat ? 1000 : Math.round(p.h);
    const props = { x: p.x, y: p.y, width: p.w, height: p.h, opacity: p.t < 0 ? 1 : 1 - p.t * 0.28 };
    if (!animate) gsap.set(it.slot, props);
    else {
      const dist = Math.hypot(p.x - innerWidth / 2, p.y - innerHeight / 2);
      gsap.to(it.slot, { ...props, duration: i === feat ? 1.15 : 1.25, ease: 'expo.inOut', delay: i === feat ? 0 : dist / 4000, overwrite: true, onComplete: i === feat ? onDone : null });
    }
  });
}

function setFeatured(i) {
  const prev = items[feat];
  feat = i;
  items[i].slot.style.zIndex = 1001;
  apply(layout(i), true);
}

// idle float
items.forEach(it => {
  gsap.to(it.flo, { y: gsap.utils.random(-5, 5), x: gsap.utils.random(-3, 3), duration: gsap.utils.random(2.4, 4.2), ease: 'sine.inOut', yoyo: true, repeat: -1, delay: gsap.utils.random(0, 2) });
});

// parallax: farther pieces drift more
const qx = items.map(it => gsap.quickTo(it.par, 'x', { duration: 0.9, ease: 'power3.out' }));
const qy = items.map(it => gsap.quickTo(it.par, 'y', { duration: 0.9, ease: 'power3.out' }));
addEventListener('pointermove', e => {
  if (mode === 'globe' || matchMedia('(pointer: coarse)').matches) return;
  const mx = e.clientX / innerWidth - 0.5, my = e.clientY / innerHeight - 0.5;
  items.forEach((it, i) => { qx[i](-mx * 72 * it.depth); qy[i](-my * 56 * it.depth); });
});

// intro: start as a single strip, then burst into orbit
(function intro() {
  const W = innerWidth, H = innerHeight;
  const sh = W < 700 ? 22 : 34, g = 4;
  let tot = items.reduce((s, it) => s + sh * it.ar + g, -g);
  const sc = Math.min(1, (W - 32) / tot);
  let x = (W - tot * sc) / 2;
  items.forEach(it => {
    const w = sh * it.ar * sc;
    gsap.set(it.slot, { x, y: H / 2 - (sh * sc) / 2, width: w, height: sh * sc, opacity: 0 });
    x += w + g * sc;
  });
  gsap.to(items.map(i => i.slot), { opacity: 1, duration: 0.5, stagger: { each: 0.02, from: 'center' } });
  gsap.delayedCall(1.1, () => apply(layout(feat), true));
})();

// ---------- globe mode: the same pieces on a sphere, spun freely in every direction ----------
let mode = 'orbit';
// M is the globe's orientation (3x3, row-major). Spins are applied in screen space, so up/down/left/right always mean what they look like.
const G = { M: [1,0,0, 0,1,0, 0,0,1], vx: 0, vy: 0, auto: 0.0018, live: false, focus: -1, dc: null, drag: false, moved: false, lx: 0, ly: 0, sx: 0, sy: 0, n: 0 };
const pts = items.map((_, k) => {
  const y = 1 - 2 * (k + 0.5) / N, r = Math.sqrt(1 - y * y), a = k * 2.39996;
  return { x: Math.cos(a) * r, y, z: Math.sin(a) * r };
});
const mul = (A, B) => { const C = new Array(9); for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) C[r*3+c] = A[r*3]*B[c] + A[r*3+1]*B[3+c] + A[r*3+2]*B[6+c]; return C; };
const rotY = a => { const c = Math.cos(a), s = Math.sin(a); return [c,0,s, 0,1,0, -s,0,c]; };
const rotX = a => { const c = Math.cos(a), s = Math.sin(a); return [1,0,0, 0,c,-s, 0,s,c]; };
function rotAxis(x, y, z, a) {
  const l = Math.hypot(x, y, z) || 1; x /= l; y /= l; z /= l;
  const c = Math.cos(a), s = Math.sin(a), t = 1 - c;
  return [t*x*x+c, t*x*y-s*z, t*x*z+s*y, t*x*y+s*z, t*y*y+c, t*y*z-s*x, t*x*z-s*y, t*y*z+s*x, t*z*z+c];
}
const apply3 = (M, p) => ({ x: M[0]*p.x + M[1]*p.y + M[2]*p.z, y: M[3]*p.x + M[4]*p.y + M[5]*p.z, z: M[6]*p.x + M[7]*p.y + M[8]*p.z });
function orthonormalize(M) {
  let a = [M[0], M[3], M[6]], b = [M[1], M[4], M[7]];
  const n = v => { const l = Math.hypot(...v); return v.map(q => q / l); };
  a = n(a); const d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; b = n(b.map((q, i) => q - d * a[i]));
  const c = [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
  return [a[0], b[0], c[0], a[1], b[1], c[1], a[2], b[2], c[2]];
}
function spin(ax, ay) { G.M = mul(rotX(ax), mul(rotY(ay), G.M)); if (++G.n % 120 === 0) G.M = orthonormalize(G.M); }
// rotation that carries point i to the front, by fraction f of the way
function towardFront(i, f) {
  const p = apply3(G.M, pts[i]);
  const ang = Math.acos(Math.max(-1, Math.min(1, p.z)));
  if (ang < 0.002) return 0;
  G.M = mul(rotAxis(p.y, -p.x, 0, ang * f), G.M);
  return ang;
}

function globeFrame() {
  const W = innerWidth, H = innerHeight, portrait = W < H;
  const R = Math.min(W * (portrait ? 0.36 : 0.29), H * 0.31);
  const cx = W / 2, cy = H / 2 - 8, F = R * 3.2;
  const base = R * (portrait ? 0.56 : 0.52);
  return items.map((it, i) => {
    const p = apply3(G.M, pts[i]);
    const persp = F / (F - p.z * R);
    const d = (p.z + 1) / 2; // 0 = far side, 1 = facing you
    const h = base * persp * (0.45 + 0.55 * d), w = h * it.ar;
    return { x: cx + p.x * R * persp - w / 2, y: cy - p.y * R * persp - h / 2, width: w, height: h, opacity: 0.2 + 0.8 * d, z: p.z };
  });
}
function renderGlobe() {
  globeFrame().forEach((p, i) => {
    const { z, ...props } = p;
    items[i].slot.style.zIndex = Math.round((z + 1) * 500);
    gsap.set(items[i].slot, props);
  });
}
function focusGlobe(i) { G.vx = G.vy = 0; G.focus = i; }

gsap.ticker.add(() => {
  if (!G.live) return;
  if (G.focus >= 0) { if (towardFront(G.focus, 0.12) < 0.004) G.focus = -1; }
  else if (!G.drag) {
    spin(G.vx, G.vy + G.auto);
    G.vx *= 0.93; G.vy *= 0.93;
  }
  renderGlobe();
});

// scroll spins it: vertical scroll rolls it up/down, horizontal (or shift+scroll) spins it left/right
addEventListener('wheel', e => {
  if (mode !== 'globe') return;
  e.preventDefault();
  G.focus = -1;
  let dx = e.deltaX, dy = e.deltaY;
  if (e.shiftKey && !dx) { dx = dy; dy = 0; }
  const k = e.deltaMode === 1 ? 0.0022 : 0.00007;
  const c = gsap.utils.clamp(-0.05, 0.05);
  G.vx = c(G.vx - dy * k);
  G.vy = c(G.vy - dx * k);
}, { passive: false });

// keyboard arrows too
addEventListener('keydown', e => {
  if (mode !== 'globe') return;
  const m = { ArrowUp: [0.05, 0], ArrowDown: [-0.05, 0], ArrowLeft: [0, -0.05], ArrowRight: [0, 0.05] }[e.key];
  if (m) { e.preventDefault(); G.focus = -1; G.vx += m[0]; G.vy += m[1]; }
});

// drag grabs and throws it
field.addEventListener('pointerdown', e => {
  if (mode !== 'globe') return;
  G.drag = true; G.moved = false; G.focus = -1;
  G.lx = G.sx = e.clientX; G.ly = G.sy = e.clientY; G.vx = G.vy = 0;
});
addEventListener('pointermove', e => {
  if (!G.drag) return;
  const dx = e.clientX - G.lx, dy = e.clientY - G.ly;
  G.lx = e.clientX; G.ly = e.clientY;
  if (Math.hypot(e.clientX - G.sx, e.clientY - G.sy) > 6) G.moved = true;
  G.vx = dy * 0.005; G.vy = dx * 0.005;
  spin(G.vx, G.vy);
});
addEventListener('pointerup', () => { G.drag = false; });
addEventListener('pointercancel', () => { G.drag = false; });

function setMode(m) {
  if (m === mode) return;
  mode = m;
  document.querySelectorAll('.mode button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  document.body.classList.toggle('globe', m === 'globe');
  if (G.dc) G.dc.kill();
  if (m === 'globe') {
    items.forEach((it, i) => { qx[i](0); qy[i](0); it.slot.classList.remove('is-feat'); });
    G.M = [1,0,0, 0,1,0, 0,0,1]; G.vx = G.vy = 0; G.focus = -1;
    towardFront(feat, 1); spin(0.22, 0);
    globeFrame().forEach((p, i) => {
      const { z, ...props } = p;
      items[i].slot.style.zIndex = Math.round((z + 1) * 500);
      gsap.to(items[i].slot, { ...props, duration: 1.15, ease: 'expo.inOut', delay: i === feat ? 0 : Math.random() * 0.18, overwrite: true });
    });
    G.dc = gsap.delayedCall(1.38, () => { G.live = true; });
  } else {
    G.live = false; G.focus = -1;
    // whatever faces you becomes the featured piece
    const L = globeFrame();
    feat = L.reduce((b, p, i) => (p.z > L[b].z ? i : b), 0);
    apply(layout(feat), true);
  }
}
document.querySelectorAll('.mode button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));

let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (mode === 'orbit') apply(layout(feat), false); }, 80); });
</script>
</body>
</html>
